<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | The Legendary Tutor</title><link rel="stylesheet" href="../css/style.css"><style>body{background:#f7f8fc}.admin{max-width:1200px;margin:48px auto;padding:0 20px}.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:24px 0;flex-wrap:wrap}.toolbar input,.toolbar select{padding:12px;border:1px solid #ddd;border-radius:8px}.table-wrap{overflow:auto;background:#fff;border-radius:14px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:14px;text-align:left;border-bottom:1px solid #eee;vertical-align:top}.table select{padding:7px}.error{color:#b42318}</style></head><body><main class="admin"><h1>Submission Dashboard</h1><p>Review learner requests, tutor applications and contact messages.</p><div class="toolbar"><div><input id="key" type="password" placeholder="Admin API key" autocomplete="off"><button class="btn btn-primary" id="load">Load</button></div><select id="filter"><option value="">All submissions</option><option value="requestTutor">Tutor requests</option><option value="becomeTutor">Tutor applications</option><option value="contact">Contact</option></select></div><p id="status"></p><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Type</th><th>Name</th><th>Email</th><th>Phone</th><th>Status</th><th>Details</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>const key=document.getElementById('key'),rows=document.getElementById('rows'),status=document.getElementById('status'),filter=document.getElementById('filter');let all=[];document.getElementById('load').onclick=load;filter.onchange=render;async function load(){status.textContent='Loading…';try{const r=await fetch('../api/submissions',{headers:{Authorization:`Bearer ${key.value}`}}),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load');all=d;render();status.textContent=`${all.length} submission(s)`}catch(e){status.textContent=e.message;status.className='error'}}async function setStatus(id,value){try{const r=await fetch('../api/submissions',{method:'PATCH',headers:{Authorization:`Bearer ${key.value}`,'Content-Type':'application/json'},body:JSON.stringify({id,status:value})});if(!r.ok)throw Error('Update failed');const x=all.find(x=>x.id===id);if(x)x.status=value}catch(e){status.textContent=e.message;status.className='error'}}function render(){rows.innerHTML='';all.filter(x=>!filter.value||x.type===filter.value).forEach(x=>{const tr=document.createElement('tr');const values=[new Date(x.created_at).toLocaleString(),x.type,x.full_name,x.email,x.phone||''];values.forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});const sd=document.createElement('td'),sel=document.createElement('select');['new','reviewing','matched','approved','rejected','closed'].forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v[0].toUpperCase()+v.slice(1);o.selected=v===x.status;sel.appendChild(o)});sel.onchange=()=>setStatus(x.id,sel.value);sd.appendChild(sel);tr.appendChild(sd);const dd=document.createElement('td');dd.style.whiteSpace='pre-line';dd.textContent=Object.entries(x.payload||{}).map(([k,v])=>`${k}: ${v}`).join('\n');tr.appendChild(dd);rows.appendChild(tr)})}</script></body></html>
