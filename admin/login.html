<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin Login | The Legendary Tutor</title><link rel="stylesheet" href="../css/style.css"><style>body{min-height:100vh;display:grid;place-items:center;background:#f7f8fc}.login{width:min(420px,calc(100% - 32px));background:#fff;padding:32px;border-radius:18px;box-shadow:0 16px 50px rgba(20,30,60,.1)}.login h1{margin:0 0 8px}.login p{color:#667085}.field{margin:18px 0}.field label{display:block;font-weight:600;margin-bottom:7px}.field input{width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid #d0d5dd;border-radius:9px;font:inherit}.btn{width:100%;margin-top:8px}.error{color:#b42318;margin-top:14px}.hint{font-size:.85rem;color:#667085;margin-top:18px}</style></head><body><main class="login"><h1>Admin Login</h1><p>Sign in to manage tutor requests, applications and messages.</p><form id="login" novalidate><div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button class="btn btn-primary" id="submit" type="submit">Sign in</button><p id="status" class="error" role="alert" aria-live="polite"></p></form><p class="hint">Administrator credentials are configured securely in the server environment.</p></main><script>const form=document.getElementById('login'),status=document.getElementById('status'),button=document.getElementById('submit');form.addEventListener('submit',async e=>{e.preventDefault();status.textContent='';if(!form.checkValidity()){form.reportValidity();return}button.disabled=true;button.textContent='Signing in…';try{const r=await fetch('../api/admin/login',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},credentials:'same-origin',body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Unable to sign in');window.location.href='/admin/'}catch(err){status.textContent=err.message}finally{button.disabled=false;button.textContent='Sign in'}});</script></body></html>
